<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Project Dashboard</title>

  <link rel="manifest" href="./manifest.json">

<meta name="apple-mobile-web-app-title" content="Projects">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --navy:#172033;
  --navy2:#293750;
  --bg:#f4f6f9;
  --card:#fff;
  --text:#18202e;
  --muted:#929aaa;
  --line:#e8ebf0;
  --green:#1d9b63;
  --greenBg:#e8f7ef;
  --blue:#3976d3;
  --blueBg:#edf4ff;
  --red:#df5353;
  --redBg:#ffeded;
  --orange:#e69328;
  --orangeBg:#fff4e4;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}

/* ================= HEADER ================= */

.header{
  background:linear-gradient(145deg,var(--navy),var(--navy2));
  color:white;
  padding:
    calc(17px + env(safe-area-inset-top))
    18px
    23px;
  border-radius:0 0 28px 28px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.eyebrow{
  font-size:10px;
  letter-spacing:1.6px;
  opacity:.55;
}

.header h1{
  margin:4px 0 0;
  font-size:24px;
}

.add-top{
  width:43px;
  height:43px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.12);
  color:white;
  font-size:27px;
}

/* ================= KPI ================= */

.kpi-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:21px;
}

.kpi{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.06);
  border-radius:17px;
  padding:12px 13px;
}

.kpi-label{
  font-size:10px;
  color:rgba(255,255,255,.62);
}

.kpi-value{
  margin-top:4px;
  font-size:21px;
  font-weight:800;
}

.kpi-value.money{
  font-size:19px;
}

/* ================= OVERALL ================= */

.overall{
  margin-top:18px;
}

.overall-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

.overall-label{
  font-size:11px;
  color:rgba(255,255,255,.62);
}

.overall-percent{
  font-size:26px;
  font-weight:800;
}

.overall-bar{
  height:8px;
  margin-top:8px;
  border-radius:20px;
  background:rgba(255,255,255,.13);
  overflow:hidden;
}

.overall-fill{
  height:100%;
  width:0;
  border-radius:20px;
  background:white;
  transition:.3s;
}

/* ================= CONTENT ================= */

.content{
  max-width:720px;
  margin:auto;
  padding:19px 13px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  font-size:18px;
}

.section-head span{
  font-size:11px;
  color:var(--muted);
}

.project-list{
  display:grid;
  gap:12px;
}

/* ================= PROJECT CARD ================= */

.project-card{
  background:white;
  border-radius:21px;
  padding:16px;
  box-shadow:0 4px 18px rgba(25,35,55,.055);
  cursor:pointer;
}

.card-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.project-name{
  font-size:16px;
  line-height:1.4;
  font-weight:750;
}

.project-location{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}

.status{
  white-space:nowrap;
  height:fit-content;
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:700;
}

.status.active{
  background:var(--blueBg);
  color:var(--blue);
}

.status.done{
  background:var(--greenBg);
  color:var(--green);
}

.status.delay{
  background:var(--redBg);
  color:var(--red);
}

.status.wait{
  background:#f0f1f3;
  color:#737b87;
}

.status.pause{
  background:var(--orangeBg);
  color:var(--orange);
}

.progress-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-top:17px;
}

.progress-label{
  font-size:10px;
  color:var(--muted);
}

.project-percent{
  font-size:25px;
  font-weight:800;
}

.card-bar{
  height:7px;
  background:#edf0f3;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.card-fill{
  height:100%;
  background:var(--navy);
  border-radius:20px;
}

.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--line);
  margin-top:13px;
  padding-top:12px;
}

.project-value{
  font-size:13px;
  font-weight:750;
}

.detail-link{
  font-size:10px;
  color:var(--muted);
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

/* ================= FAB ================= */

.fab{
  position:fixed;
  right:20px;
  bottom:calc(22px + env(safe-area-inset-bottom));
  width:58px;
  height:58px;
  border:0;
  border-radius:19px;
  background:var(--navy);
  color:white;
  font-size:29px;
  box-shadow:0 10px 28px rgba(23,32,51,.28);
  z-index:20;
}

/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(8,15,28,.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(18px + env(safe-area-inset-bottom));
}

.modal.show{
  display:flex;
}

.modal-box,
.detail-box{
  width:100%;
  max-width:540px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:24px;
  padding:19px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:11px;
  background:#f0f1f3;
  font-size:18px;
}

label{
  display:block;
  margin:14px 0 6px;
  font-size:11px;
  font-weight:700;
}

input,select,textarea{
  width:100%;
  border:1.5px solid #e1e5ea;
  border-radius:13px;
  background:#fafbfc;
  padding:12px;
  font-size:15px;
  font-family:inherit;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  background:white;
  border-color:#8ea0bd;
}

textarea{
  min-height:78px;
  resize:none;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.progress-input{
  display:grid;
  grid-template-columns:1fr 58px;
  align-items:center;
  gap:10px;
}

input[type="range"]{
  padding:0;
}

.progress-number{
  text-align:center;
  font-size:16px;
  font-weight:800;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1.7fr;
  gap:9px;
  margin-top:22px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:14px 8px;
  font-size:14px;
  font-weight:700;
}

.cancel{
  background:#eef0f3;
  color:#555d69;
}

.save{
  background:var(--navy);
  color:white;
}

/* ================= DETAIL ================= */

.detail-status{
  display:inline-block;
}

.detail-title{
  margin-top:11px;
  font-size:21px;
  line-height:1.4;
  font-weight:800;
}

.detail-location{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
}

.detail-progress{
  text-align:center;
  padding:22px 0 19px;
}

.progress-circle{
  width:130px;
  height:130px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.progress-circle::after{
  content:"";
  position:absolute;
  width:102px;
  height:102px;
  background:white;
  border-radius:50%;
}

.progress-circle span{
  position:relative;
  z-index:2;
  font-size:27px;
  font-weight:800;
}

.detail-value{
  margin-top:5px;
  font-size:21px;
  font-weight:800;
}

.detail-value-label{
  font-size:10px;
  color:var(--muted);
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:17px;
}

.info{
  background:#f6f7f9;
  border-radius:14px;
  padding:12px;
}

.info small{
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-bottom:5px;
}

.info strong{
  font-size:12px;
}

.note{
  margin-top:12px;
  padding:13px;
  background:#f6f7f9;
  border-radius:14px;
  font-size:12px;
  line-height:1.5;
  white-space:pre-wrap;
}

.task-section{
  margin-top:20px;
}

.task-title{
  font-size:14px;
  font-weight:750;
  margin-bottom:8px;
}

.task{
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.task-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.task-name{
  font-size:12px;
  font-weight:650;
}

.task-pct{
  font-size:11px;
  font-weight:750;
}

.task-bar{
  height:5px;
  background:#edf0f3;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.task-bar div{
  height:100%;
  background:var(--green);
}

.task-delete{
  display:inline-block;
  margin-top:6px;
  font-size:9px;
  color:var(--red);
}

.detail-buttons{
  display:grid;
  grid-template-columns:.75fr 1fr 1.45fr;
  gap:8px;
  margin-top:19px;
}

.delete-btn{
  background:var(--redBg);
  color:var(--red);
}

.edit-btn{
  background:#eef0f3;
  color:var(--text);
}

.task-btn{
  background:var(--navy);
  color:white;
}

@media(max-width:380px){
  .header{
    padding-left:14px;
    padding-right:14px;
  }

  .content{
    padding-left:10px;
    padding-right:10px;
  }

  .kpi-value{
    font-size:19px;
  }

  .kpi-value.money{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="topbar">

    <div>
      <div class="eyebrow">PERSONAL WORKSPACE</div>
      <h1>Project Dashboard</h1>
    </div>

    <button class="add-top" onclick="openProjectModal()">+</button>

  </div>

  <div class="kpi-grid">

    <div class="kpi">
      <div class="kpi-label">โครงการทั้งหมด</div>
      <div class="kpi-value" id="totalProjects">0</div>
    </div>

    <div class="kpi">
      <div class="kpi-label">มูลค่ารวม</div>
      <div class="kpi-value money" id="totalValue">฿0</div>
    </div>

    <div class="kpi">
      <div class="kpi-label">สำเร็จแล้ว</div>
      <div class="kpi-value" id="completedProjects">0</div>
    </div>

    <div class="kpi">
      <div class="kpi-label">กำลังดำเนินการ</div>
      <div class="kpi-value" id="activeProjects">0</div>
    </div>

  </div>

  <div class="overall">

    <div class="overall-top">

      <div class="overall-label">
        ความคืบหน้ารวม
      </div>

      <div class="overall-percent" id="overallPercent">
        0%
      </div>

    </div>

    <div class="overall-bar">
      <div id="overallFill" class="overall-fill"></div>
    </div>

  </div>

</header>


<main class="content">

  <div class="section-head">

    <h2>โครงการของฉัน</h2>

    <span id="todayText"></span>

  </div>

  <div id="projectList" class="project-list"></div>

</main>


<button class="fab" onclick="openProjectModal()">+</button>


<!-- PROJECT FORM -->

<div id="projectModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="projectModalTitle">
        เพิ่มโครงการ
      </h2>

      <button class="close" onclick="closeProjectModal()">×</button>

    </div>

    <label>ชื่อโครงการ</label>

    <input
      id="projectName"
      type="text"
      placeholder="เช่น งานติดตั้งระบบ HVAC"
    >

    <label>สถานที่ / ลูกค้า</label>

    <input
      id="projectLocation"
      type="text"
      placeholder="เช่น โรงฟักไข่ PWF ราชบุรี"
    >

    <label>มูลค่าโครงการ (บาท)</label>

    <input
      id="projectValue"
      type="number"
      inputmode="decimal"
      min="0"
      placeholder="เช่น 8500000"
    >

    <div class="two">

      <div>
        <label>วันที่เริ่ม</label>
        <input id="startDate" type="date">
      </div>

      <div>
        <label>กำหนดเสร็จ</label>
        <input id="endDate" type="date">
      </div>

    </div>

    <label>สถานะ</label>

    <select id="projectStatus">
      <option value="active">กำลังดำเนินการ</option>
      <option value="wait">ยังไม่เริ่ม</option>
      <option value="done">เสร็จแล้ว</option>
      <option value="delay">ล่าช้า</option>
      <option value="pause">พักงาน</option>
    </select>

    <label>ความคืบหน้า</label>

    <div class="progress-input">

      <input
        id="projectProgress"
        type="range"
        min="0"
        max="100"
        value="0"
        oninput="updateProgressLabel()"
      >

      <div id="progressLabel" class="progress-number">
        0%
      </div>

    </div>

    <label>รายละเอียด / หมายเหตุ</label>

    <textarea
      id="projectNote"
      placeholder="รายละเอียด ปัญหา หรือสิ่งที่ต้องติดตาม"
    ></textarea>

    <div class="modal-buttons">

      <button class="btn cancel" onclick="closeProjectModal()">
        ยกเลิก
      </button>

      <button class="btn save" onclick="saveProject()">
        บันทึก
      </button>

    </div>

  </div>

</div>


<!-- DETAIL -->

<div id="detailModal" class="modal">

  <div class="detail-box">

    <div class="modal-head">
      <div></div>
      <button class="close" onclick="closeDetail()">×</button>
    </div>

    <div id="detailContent"></div>

  </div>

</div>


<!-- TASK -->

<div id="taskModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>เพิ่มรายการงาน</h2>

      <button class="close" onclick="closeTaskModal()">×</button>

    </div>

    <label>รายการงาน</label>

    <input
      id="taskName"
      type="text"
      placeholder="เช่น ติดตั้ง Duct"
    >

    <label>ความคืบหน้า</label>

    <div class="progress-input">

      <input
        id="taskProgress"
        type="range"
        min="0"
        max="100"
        value="0"
        oninput="updateTaskLabel()"
      >

      <div id="taskProgressLabel" class="progress-number">
        0%
      </div>

    </div>

    <div class="modal-buttons">

      <button class="btn cancel" onclick="closeTaskModal()">
        ยกเลิก
      </button>

      <button class="btn save" onclick="saveTask()">
        เพิ่มงาน
      </button>

    </div>

  </div>

</div>


<script>

/*
  สำคัญ:
  ใช้ KEY เดิม
  Project ที่บันทึกไว้แล้วจึงยังอยู่
*/

const STORAGE_KEY = "personal-project-dashboard-v1";

let projects = [];
let editingProjectId = null;
let selectedProjectId = null;


/* ================= LOAD ================= */

function loadData(){

  const saved = localStorage.getItem(STORAGE_KEY);

  if(saved){

    try{

      projects = JSON.parse(saved);

      if(!Array.isArray(projects)){
        projects = [];
      }

    }catch(e){

      projects = [];

    }

  }

}


/* ================= SAVE ================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(projects)
  );

}


/* ================= ESCAPE ================= */

function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ================= STATUS ================= */

function statusText(status){

  const map = {
    active:"กำลังดำเนินการ",
    wait:"ยังไม่เริ่ม",
    done:"เสร็จแล้ว",
    delay:"ล่าช้า",
    pause:"พักงาน"
  };

  return map[status] || status;

}


/* ================= DATE ================= */

function formatDate(value){

  if(!value){
    return "-";
  }

  const p = value.split("-");

  if(p.length !== 3){
    return value;
  }

  return (
    Number(p[2]) +
    "/" +
    Number(p[1]) +
    "/" +
    String(Number(p[0]) + 543).slice(-2)
  );

}


/* ================= MONEY ================= */

function money(value){

  const number =
    Number(value || 0);

  return "฿" +
    number.toLocaleString("th-TH");
}


/*
  หน้า Dashboard
  ถ้าตัวเลขใหญ่จะย่อเป็น M
*/

function compactMoney(value){

  const n =
    Number(value || 0);

  if(n >= 1000000){

    return "฿" +
      (n / 1000000)
        .toLocaleString(
          "th-TH",
          {
            maximumFractionDigits:2
          }
        ) +
      " M";

  }

  if(n >= 1000){

    return "฿" +
      (n / 1000)
        .toLocaleString(
          "th-TH",
          {
            maximumFractionDigits:1
          }
        ) +
      " K";

  }

  return "฿" +
    n.toLocaleString("th-TH");

}


/* ================= RENDER ================= */

function render(){

  const list =
    document.getElementById("projectList");

  list.innerHTML = "";


  /* จำนวนทั้งหมด */

  document.getElementById("totalProjects").textContent =
    projects.length;


  /* มูลค่ารวม */

  const totalValue =
    projects.reduce(
      (sum,p) =>
        sum + Number(p.value || 0),
      0
    );

  document.getElementById("totalValue").textContent =
    compactMoney(totalValue);


  /* สำเร็จ */

  const completed =
    projects.filter(
      p => p.status === "done"
    ).length;

  document.getElementById("completedProjects").textContent =
    completed;


  /*
    กำลังดำเนินการ

    รวม active + delay
    เพราะยังเป็นโครงการที่ยังทำอยู่
  */

  const active =
    projects.filter(
      p =>
        p.status === "active" ||
        p.status === "delay"
    ).length;

  document.getElementById("activeProjects").textContent =
    active;


  /* OVERALL PROGRESS */

  const progressTotal =
    projects.reduce(
      (sum,p) =>
        sum + Number(p.progress || 0),
      0
    );

  const overall =
    projects.length
      ? Math.round(
          progressTotal /
          projects.length
        )
      : 0;


  document.getElementById("overallPercent").textContent =
    overall + "%";

  document.getElementById("overallFill").style.width =
    overall + "%";


  /* EMPTY */

  if(projects.length === 0){

    list.innerHTML = `
      <div class="empty">

        <div class="empty-icon">📊</div>

        <strong>ยังไม่มีโครงการ</strong>

        <div style="font-size:12px;margin-top:5px;">
          กด + เพื่อเพิ่มโครงการแรก
        </div>

      </div>
    `;

    return;

  }


  /* PROJECT CARDS */

  projects.forEach(project => {

    const card =
      document.createElement("div");

    card.className =
      "project-card";

    card.onclick =
      () => openDetail(project.id);


    card.innerHTML = `

      <div class="card-head">

        <div>

          <div class="project-name">
            ${escapeHTML(project.name)}
          </div>

          <div class="project-location">
            ${escapeHTML(project.location || "ไม่ระบุสถานที่")}
          </div>

        </div>

        <div class="status ${project.status}">
          ${statusText(project.status)}
        </div>

      </div>


      <div class="progress-row">

        <div class="progress-label">
          ความคืบหน้า
        </div>

        <div class="project-percent">
          ${Number(project.progress || 0)}%
        </div>

      </div>


      <div class="card-bar">

        <div
          class="card-fill"
          style="width:${Number(project.progress || 0)}%"
        ></div>

      </div>


      <div class="card-bottom">

        <div class="project-value">
          ${money(project.value)}
        </div>

        <div class="detail-link">
          ดูรายละเอียด ›
        </div>

      </div>

    `;


    list.appendChild(card);

  });

}


/* ================= PROJECT MODAL ================= */

function openProjectModal(projectId = null){

  editingProjectId =
    projectId;


  document.getElementById("projectModalTitle").textContent =
    projectId
      ? "แก้ไขโครงการ"
      : "เพิ่มโครงการ";


  if(projectId){

    const project =
      projects.find(
        p => p.id === projectId
      );

    if(!project){
      return;
    }


    document.getElementById("projectName").value =
      project.name || "";

    document.getElementById("projectLocation").value =
      project.location || "";

    document.getElementById("projectValue").value =
      Number(project.value || 0);

    document.getElementById("startDate").value =
      project.startDate || "";

    document.getElementById("endDate").value =
      project.endDate || "";

    document.getElementById("projectStatus").value =
      project.status || "active";

    document.getElementById("projectProgress").value =
      Number(project.progress || 0);

    document.getElementById("projectNote").value =
      project.note || "";

  }

  else{

    document.getElementById("projectName").value = "";

    document.getElementById("projectLocation").value = "";

    document.getElementById("projectValue").value = "";

    document.getElementById("startDate").value = "";

    document.getElementById("endDate").value = "";

    document.getElementById("projectStatus").value = "active";

    document.getElementById("projectProgress").value = 0;

    document.getElementById("projectNote").value = "";

  }


  updateProgressLabel();


  document
    .getElementById("projectModal")
    .classList.add("show");

}


function closeProjectModal(){

  document
    .getElementById("projectModal")
    .classList.remove("show");

}


/* ================= PROGRESS ================= */

function updateProgressLabel(){

  document.getElementById("progressLabel").textContent =
    document.getElementById("projectProgress").value +
    "%";

}


/* ================= SAVE PROJECT ================= */

function saveProject(){

  const name =
    document.getElementById("projectName")
      .value
      .trim();


  if(!name){

    alert("กรุณาใส่ชื่อโครงการ");

    return;

  }


  const data = {

    name:name,

    location:
      document.getElementById("projectLocation")
        .value
        .trim(),

    value:
      Number(
        document.getElementById("projectValue")
          .value || 0
      ),

    startDate:
      document.getElementById("startDate")
        .value,

    endDate:
      document.getElementById("endDate")
        .value,

    status:
      document.getElementById("projectStatus")
        .value,

    progress:
      Number(
        document.getElementById("projectProgress")
          .value
      ),

    note:
      document.getElementById("projectNote")
        .value
        .trim()

  };


  if(editingProjectId){

    const project =
      projects.find(
        p => p.id === editingProjectId
      );


    if(project){

      Object.assign(
        project,
        data
      );

    }

  }

  else{

    projects.unshift({

      id:Date.now(),

      ...data,

      tasks:[],

      createdAt:
        new Date().toISOString()

    });

  }


  saveData();

  closeProjectModal();

  render();

}


/* ================= DETAIL ================= */

function openDetail(id){

  selectedProjectId =
    id;


  const project =
    projects.find(
      p => p.id === id
    );


  if(!project){
    return;
  }


  const tasks =
    project.tasks || [];


  const progress =
    Number(project.progress || 0);


  const circle =

    `conic-gradient(
      var(--navy) ${progress}%,
      #edf0f3 ${progress}% 100%
    )`;


  let taskHTML = "";


  if(tasks.length === 0){

    taskHTML = `

      <div style="
        text-align:center;
        color:var(--muted);
        padding:18px 0;
        font-size:11px;
      ">
        ยังไม่มีรายการงาน
      </div>

    `;

  }

  else{

    tasks.forEach(task => {

      taskHTML += `

        <div class="task">

          <div class="task-row">

            <div class="task-name">
              ${escapeHTML(task.name)}
            </div>

            <div class="task-pct">
              ${Number(task.progress || 0)}%
            </div>

          </div>

          <div class="task-bar">

            <div
              style="width:${Number(task.progress || 0)}%"
            ></div>

          </div>

          <span
            class="task-delete"
            onclick="deleteTask(event,${task.id})"
          >
            ลบรายการ
          </span>

        </div>

      `;

    });

  }


  const completedTasks =
    tasks.filter(
      t => Number(t.progress || 0) >= 100
    ).length;


  document.getElementById("detailContent").innerHTML = `

    <div class="status ${project.status} detail-status">
      ${statusText(project.status)}
    </div>


    <div class="detail-title">
      ${escapeHTML(project.name)}
    </div>


    <div class="detail-location">
      ${escapeHTML(project.location || "ไม่ระบุสถานที่")}
    </div>


    <div class="detail-progress">

      <div
        class="progress-circle"
        style="background:${circle}"
      >

        <span>
          ${progress}%
        </span>

      </div>

      <div style="margin-top:17px;">

        <div class="detail-value-label">
          มูลค่าโครงการ
        </div>

        <div class="detail-value">
          ${money(project.value)}
        </div>

      </div>

    </div>


    <div class="info-grid">

      <div class="info">

        <small>วันที่เริ่ม</small>

        <strong>
          ${formatDate(project.startDate)}
        </strong>

      </div>


      <div class="info">

        <small>กำหนดเสร็จ</small>

        <strong>
          ${formatDate(project.endDate)}
        </strong>

      </div>


      <div class="info">

        <small>รายการงาน</small>

        <strong>
          ${tasks.length} งาน
        </strong>

      </div>


      <div class="info">

        <small>งานเสร็จ</small>

        <strong>
          ${completedTasks} งาน
        </strong>

      </div>

    </div>


    ${
      project.note
      ?
      `
        <div class="note">
          ${escapeHTML(project.note)}
        </div>
      `
      :
      ""
    }


    <div class="task-section">

      <div class="task-title">
        รายการงาน
      </div>

      ${taskHTML}

    </div>


    <div class="detail-buttons">

      <button
        class="btn delete-btn"
        onclick="deleteProject()"
      >
        ลบ
      </button>

      <button
        class="btn edit-btn"
        onclick="editCurrentProject()"
      >
        แก้ไข
      </button>

      <button
        class="btn task-btn"
        onclick="openTaskModal()"
      >
        + เพิ่มงาน
      </button>

    </div>

  `;


  document
    .getElementById("detailModal")
    .classList.add("show");

}


function closeDetail(){

  document
    .getElementById("detailModal")
    .classList.remove("show");

}


/* ================= EDIT ================= */

function editCurrentProject(){

  const id =
    selectedProjectId;

  closeDetail();

  openProjectModal(id);

}


/* ================= DELETE PROJECT ================= */

function deleteProject(){

  const project =
    projects.find(
      p => p.id === selectedProjectId
    );


  if(!project){
    return;
  }


  if(
    !confirm(
      "ลบโครงการ \"" +
      project.name +
      "\" ใช่หรือไม่?"
    )
  ){

    return;

  }


  projects =
    projects.filter(
      p => p.id !== selectedProjectId
    );


  saveData();

  closeDetail();

  render();

}


/* ================= TASK ================= */

function openTaskModal(){

  document.getElementById("taskName").value =
    "";

  document.getElementById("taskProgress").value =
    0;

  updateTaskLabel();


  document
    .getElementById("taskModal")
    .classList.add("show");

}


function closeTaskModal(){

  document
    .getElementById("taskModal")
    .classList.remove("show");

}


function updateTaskLabel(){

  document.getElementById("taskProgressLabel").textContent =

    document.getElementById("taskProgress").value +
    "%";

}


/* ================= SAVE TASK ================= */

function saveTask(){

  const name =
    document.getElementById("taskName")
      .value
      .trim();


  if(!name){

    alert("กรุณาใส่ชื่อรายการงาน");

    return;

  }


  const project =
    projects.find(
      p => p.id === selectedProjectId
    );


  if(!project){
    return;
  }


  if(!project.tasks){

    project.tasks = [];

  }


  project.tasks.push({

    id:Date.now(),

    name:name,

    progress:
      Number(
        document.getElementById("taskProgress")
          .value
      )

  });


  saveData();

  closeTaskModal();

  openDetail(selectedProjectId);

  render();

}


/* ================= DELETE TASK ================= */

function deleteTask(event,taskId){

  event.stopPropagation();


  const project =
    projects.find(
      p => p.id === selectedProjectId
    );


  if(!project){
    return;
  }


  project.tasks =
    (project.tasks || [])
      .filter(
        task => task.id !== taskId
      );


  saveData();

  openDetail(selectedProjectId);

  render();

}


/* ================= TODAY ================= */

function showToday(){

  document.getElementById("todayText").textContent =

    new Date().toLocaleDateString(
      "th-TH",
      {
        day:"numeric",
        month:"short",
        year:"2-digit"
      }
    );

}


/* ================= BACKGROUND CLOSE ================= */

document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      function(event){

        if(event.target === modal){

          modal.classList.remove("show");

        }

      }
    );

  });


/* ================= START ================= */

loadData();

showToday();

render();

</script>

</body>
</html>
